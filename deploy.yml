name: Deploy Supabase Signup Page

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true


jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      # -------------------------------------------------------
      # Supabase 설정 주입
      # -------------------------------------------------------

      - name: Inject Supabase configuration
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

        run: |

          python3 - <<'PY'

          from pathlib import Path
          import os

          path = Path("index.html")

          html = path.read_text(
              encoding="utf-8"
          )

          supabase_url = os.environ["SUPABASE_URL"]

          publishable_key = os.environ[
              "SUPABASE_PUBLISHABLE_KEY"
          ]

          config = f"""
          <script>
          window.__SUPABASE_URL__ = {supabase_url!r};
          window.__SUPABASE_PUBLISHABLE_KEY__ = {publishable_key!r};
          </script>
          """

          html = html.replace(
              "</head>",
              config + "\n</head>"
          )

          path.write_text(
              html,
              encoding="utf-8"
          )

          PY


      # -------------------------------------------------------
      # GitHub Pages 설정
      # -------------------------------------------------------

      - name: Setup Pages
        uses: actions/configure-pages@v5


      # -------------------------------------------------------
      # Artifact
      # -------------------------------------------------------

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3

        with:
          path: .


      # -------------------------------------------------------
      # Deploy
      # -------------------------------------------------------

      - name: Deploy to GitHub Pages
        id: deployment

        uses: actions/deploy-pages@v4
